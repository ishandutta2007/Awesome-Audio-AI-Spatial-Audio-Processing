<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#090d1a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      
      /* Dynamic animations */
      @keyframes waveFloat {
        0%, 100% { transform: translateY(0px) scaleY(1); }
        50% { transform: translateY(-8px) scaleY(1.25); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes orbitRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes barDance1 {
        0%, 100% { height: 25px; y: 315px; }
        50% { height: 75px; y: 265px; }
      }
      @keyframes barDance2 {
        0%, 100% { height: 60px; y: 280px; }
        50% { height: 30px; y: 310px; }
      }
      @keyframes barDance3 {
        0%, 100% { height: 45px; y: 295px; }
        50% { height: 85px; y: 255px; }
      }

      .pulse-orb {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .orbit-group {
        animation: orbitRotate 28s linear infinite;
        transform-origin: 1040px 140px;
      }
      .b1 { animation: barDance1 1.6s ease-in-out infinite; }
      .b2 { animation: barDance2 2.1s ease-in-out infinite 0.2s; }
      .b3 { animation: barDance3 1.8s ease-in-out infinite 0.4s; }
      .b4 { animation: barDance1 2.3s ease-in-out infinite 0.6s; }
      .b5 { animation: barDance2 1.5s ease-in-out infinite 0.8s; }
      .b6 { animation: barDance3 2.0s ease-in-out infinite 0.3s; }
      .b7 { animation: barDance1 1.7s ease-in-out infinite 0.5s; }
      .b8 { animation: barDance2 2.2s ease-in-out infinite 0.7s; }
      .b9 { animation: barDance3 1.9s ease-in-out infinite 0.1s; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="18" fill="url(#bgGrad)" />

  <!-- Subtle Acoustic Grid in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="1040" cy="140" r="140" fill="#6366f1" opacity="0.3" filter="url(#orbGlow)" class="pulse-orb" />
  <circle cx="180" cy="320" r="120" fill="#0284c7" opacity="0.25" filter="url(#orbGlow)" class="pulse-orb" style="animation-delay: -3.5s;" />

  <!-- 3D Spatial Audio Rings & Orbit Sphere in Upper Right Background -->
  <g class="orbit-group" opacity="0.45">
    <ellipse cx="1040" cy="140" rx="90" ry="32" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" />
    <ellipse cx="1040" cy="140" rx="90" ry="32" fill="none" stroke="#c084fc" stroke-width="2" transform="rotate(60 1040 140)" />
    <ellipse cx="1040" cy="140" rx="90" ry="32" fill="none" stroke="#818cf8" stroke-width="2" transform="rotate(120 1040 140)" />
    <circle cx="1130" cy="140" r="7" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="995" cy="90" r="5" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Dynamic Audio Equalizer Spectrum Bars in Lower Background -->
  <g opacity="0.55">
    <!-- Equalizer Left Side -->
    <rect class="b1" x="70" y="315" width="8" height="25" rx="4" fill="url(#neonCyan)" />
    <rect class="b2" x="84" y="280" width="8" height="60" rx="4" fill="url(#neonCyan)" />
    <rect class="b3" x="98" y="295" width="8" height="45" rx="4" fill="url(#neonCyan)" />
    <rect class="b4" x="112" y="305" width="8" height="35" rx="4" fill="url(#neonCyan)" />
    <rect class="b5" x="126" y="275" width="8" height="65" rx="4" fill="url(#neonCyan)" />
    <rect class="b6" x="140" y="290" width="8" height="50" rx="4" fill="url(#neonCyan)" />
    <rect class="b7" x="154" y="310" width="8" height="30" rx="4" fill="url(#neonCyan)" />
    <rect class="b8" x="168" y="285" width="8" height="55" rx="4" fill="url(#neonCyan)" />
    <rect class="b9" x="182" y="300" width="8" height="40" rx="4" fill="url(#neonCyan)" />

    <!-- Equalizer Right Side -->
    <rect class="b9" x="970" y="300" width="8" height="40" rx="4" fill="url(#neonPurple)" />
    <rect class="b8" x="984" y="285" width="8" height="55" rx="4" fill="url(#neonPurple)" />
    <rect class="b7" x="998" y="310" width="8" height="30" rx="4" fill="url(#neonPurple)" />
    <rect class="b6" x="1012" y="290" width="8" height="50" rx="4" fill="url(#neonPurple)" />
    <rect class="b5" x="1026" y="275" width="8" height="65" rx="4" fill="url(#neonPurple)" />
    <rect class="b4" x="1040" y="305" width="8" height="35" rx="4" fill="url(#neonPurple)" />
    <rect class="b3" x="1054" y="295" width="8" height="45" rx="4" fill="url(#neonPurple)" />
    <rect class="b2" x="1068" y="280" width="8" height="60" rx="4" fill="url(#neonPurple)" />
    <rect class="b1" x="1082" y="315" width="8" height="25" rx="4" fill="url(#neonPurple)" />
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed pristine readability & no overlap -->
  <g transform="translate(80, 0)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 65)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8" filter="url(#glow)" />
      <text x="30" y="19" class="badge-text" fill="#38bdf8">AUDIO AI &amp; DSP DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text">Awesome Audio AI &amp; Spatial Audio</text>

    <!-- Highlight Underline Accent -->
    <rect x="0" y="162" width="340" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="0" y="205" class="subtitle-text">
      Speech Enhancement • Real-Time Denoising • 3D Spatial Engines • AI Mastering
    </text>

    <!-- Interactive / Feature Pills in Foreground -->
    <g transform="translate(0, 240)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="17" fill="#131d33" stroke="#38bdf8" stroke-width="1.2" />
        <text x="20" y="22" class="badge-text" fill="#38bdf8">🎧 Ambisonics &amp; HRTF</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(192, 0)">
        <rect width="180" height="34" rx="17" fill="#1b1736" stroke="#818cf8" stroke-width="1.2" />
        <text x="20" y="22" class="badge-text" fill="#a5b4fc">⚡ Real-Time Denoise</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(384, 0)">
        <rect width="170" height="34" rx="17" fill="#201533" stroke="#c084fc" stroke-width="1.2" />
        <text x="20" y="22" class="badge-text" fill="#e9d5ff">🎛️ Neural Mastering</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(566, 0)">
        <rect width="190" height="34" rx="17" fill="#13232e" stroke="#34d399" stroke-width="1.2" />
        <text x="20" y="22" class="badge-text" fill="#6ee7b7">🎙️ Stem &amp; Voice Isolation</text>
      </g>
    </g>

    <!-- Bottom Stat Bar -->
    <g transform="translate(0, 310)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b" font-weight="500">
        Curated for Audio Engineers, Podcasters, Game Audio Designers, XR Builders &amp; ML Researchers
      </text>
    </g>
  </g>
</svg>
